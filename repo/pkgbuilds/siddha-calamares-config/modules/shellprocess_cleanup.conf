i18n:
  name: "Cleaning up live-only environment"

dont-chroot: false
timeout: 60
script:
  - "-userdel -rf live"
  - "-rm -f /etc/sudoers.d/g_wheel"
  - "-rm -f /etc/sddm.conf.d/autologin.conf"
  - "-rm -f /etc/skel/Desktop/siddha-installer.desktop"
  - "-rm -f /etc/skel/.config/autostart/siddha-installer.desktop"
