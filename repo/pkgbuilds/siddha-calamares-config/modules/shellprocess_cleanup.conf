---
i18n:
  name: "Cleaning up live-only environment"

dontChroot: false
timeout: 60
script:
  - "-userdel -rf live"
  - "-rm -f /etc/sudoers.d/g_wheel"
  - "-rm -f /etc/sddm.conf.d/autologin.conf"
  - "-sed -i '/initial_session/,+3d' /etc/greetd/cosmic-greeter.toml"
  - "-rm -f /etc/skel/Desktop/siddha-installer.desktop"
  - "-rm -f /etc/skel/.config/autostart/siddha-installer.desktop"
  - "-sh -c 'rm -f /home/*/{Desktop,}/siddha-installer.desktop'"
  - "-rm -f /usr/share/applications/siddha-installer.desktop"
  - "-rm -f /etc/polkit-1/rules.d/49-nopasswd_global.rules"
  - "-chmod 4755 /usr/lib/polkit-1/polkit-agent-helper-1"
  - "-sed -i '/^\\[siddha\\]/,+2 s/^/#/' /etc/pacman.conf"
