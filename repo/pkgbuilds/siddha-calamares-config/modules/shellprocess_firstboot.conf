i18n:
  name: "Configuring system services and security"

dont-chroot: false
timeout: 300
script:
  - "systemctl enable NetworkManager.service sddm.service bluetooth.service firewalld.service"
  - "systemctl enable snapper-timeline.timer snapper-cleanup.timer grub-btrfsd.service || true"
  - "pacman-key --init && pacman-key --populate archlinux || true"
  - "/usr/bin/siddha-gpu-setup --install || true"
