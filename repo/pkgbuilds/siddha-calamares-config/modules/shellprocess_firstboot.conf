---
i18n:
  name: "Configuring system services and security"

dontChroot: false
timeout: 300
script:
  - "systemctl enable NetworkManager.service cosmic-greeter.service bluetooth.service firewalld.service power-profiles-daemon.service fstrim.timer paccache.timer || true"
  - "systemctl enable snapper-timeline.timer snapper-cleanup.timer grub-btrfsd.service || true"
  - "pacman-key --init && pacman-key --populate archlinux siddha || true"
  - "/usr/bin/siddha-gpu-setup --install || true"
