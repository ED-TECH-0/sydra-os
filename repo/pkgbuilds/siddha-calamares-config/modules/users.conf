---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - lp
    - video
    - network
    - storage
    - name: wheel
      must_exist: false
      system: true
    - audio
    - name: nopasswdlogin
      must_exist: false
      system: true

sudoersGroup: wheel
autologinGroup: autologin
sudoersConfigureWithGroup: false
setRootPassword: true
doReusePassword: true

displayAutologin: true
doAutologin: false

# Allow short passwords without special character restrictions
passwordRequirements:
    minLength: 1
    maxLength: -1
    libpwquality:
        - minlen=0
        - minclass=0

allowWeakPasswords: true
allowWeakPasswordsDefault: true

user:
  shell: /bin/bash
  forbidden_names: [ root ]
  home_permissions: "o700"
  nopasswd_group: "nopasswdlogin"

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "sydra-${cpu}"
  forbidden_names: [ localhost ]

allowActiveDirectory: false
