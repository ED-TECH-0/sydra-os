i18n:
  name: "Configuring kernel initramfs"

dont-chroot: false
timeout: 300
script:
  - "-rm -f /etc/mkinitcpio.conf.d/archiso.conf"
  - "-rm -f /etc/mkinitcpio.d/archiso.preset"
  - "sh -c 'if [ ! -f /boot/vmlinuz-linux ]; then for k in /usr/lib/modules/*/vmlinuz; do [ -f \"$k\" ] && cp \"$k\" /boot/vmlinuz-linux && break; done; fi'"
  - "mkinitcpio -P"
