modules-search: [ local ]

instances:
  - id: initcpio-fix
    module: shellprocess
    config: shellprocess_initcpio.conf
  - id: cleanup
    module: shellprocess
    config: shellprocess_cleanup.conf
  - id: firstboot
    module: shellprocess
    config: shellprocess_firstboot.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - shellprocess@initcpio-fix
      - initcpiocfg
      - initcpio
      - grubcfg
      - bootloader
      - services-systemd
      - shellprocess@cleanup
      - shellprocess@firstboot
      - umount
  - show:
      - finished

branding: siddha
prompt-install: false
dont-chroot: false
