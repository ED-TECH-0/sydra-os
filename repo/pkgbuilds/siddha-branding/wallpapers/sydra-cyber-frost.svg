<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <!-- Ultra Blur Filter for Frosted Background -->
    <filter id="glass-backdrop" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="220" />
    </filter>

    <!-- Glowing Cyan/Teal Gradient -->
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Glowing Purple/Magenta Gradient -->
    <linearGradient id="neon-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>

    <!-- Deep Blue Blob Gradient -->
    <linearGradient id="deep-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>

  <!-- Deep Velvet Night Canvas -->
  <rect width="3840" height="2160" fill="#0C0A16" />

  <!-- Luminous Blurred Ambient Glass Light Shapes -->
  <g filter="url(#glass-backdrop)">
    <!-- Electric Purple Glow Center -->
    <circle cx="1800" cy="1000" r="850" fill="url(#neon-purple)" opacity="0.65" />
    <!-- Vibrant Cyan Light Right -->
    <circle cx="2800" cy="1200" r="750" fill="url(#neon-cyan)" opacity="0.60" />
    <!-- Deep Indigo Left -->
    <circle cx="1000" cy="1300" r="800" fill="url(#deep-blue)" opacity="0.55" />
    <!-- Warm Violet Accent Top -->
    <circle cx="2200" cy="400" r="600" fill="#9333EA" opacity="0.50" />
    <!-- High Light Cyan Accent Top Left -->
    <circle cx="600" cy="500" r="500" fill="#06B6D4" opacity="0.40" />
  </g>

  <!-- Specular Lens Sheen -->
  <radialGradient id="lens-sheen" cx="50%" cy="40%" r="60%">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08" />
    <stop offset="50%" stop-color="#A855F7" stop-opacity="0.03" />
    <stop offset="100%" stop-color="#000000" stop-opacity="0.50" />
  </radialGradient>
  <rect width="3840" height="2160" fill="url(#lens-sheen)" />
</svg>
