<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <filter id="ultra-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="180" />
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="3840" height="2160" fill="#07090E" />

  <!-- Luminous Blurred Ambient Blobs -->
  <g filter="url(#ultra-blur)">
    <circle cx="20%" cy="25%" r="40%" fill="#123048" fill-opacity="0.40" />
    <circle cx="80%" cy="30%" r="45%" fill="#1F2342" fill-opacity="0.35" />
    <circle cx="60%" cy="75%" r="40%" fill="#0D2A3A" fill-opacity="0.35" />
  </g>

  <!-- Subtle Film Grain / Vignette Overlay -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="60%" stop-color="#000000" stop-opacity="0.0" />
    <stop offset="100%" stop-color="#000000" stop-opacity="0.45" />
  </radialGradient>
  <rect width="3840" height="2160" fill="url(#vignette)" />
</svg>
