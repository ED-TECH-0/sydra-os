<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <!-- Deep Obsidian Canvas Gradients -->
    <linearGradient id="canvas-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E" />
      <stop offset="40%" stop-color="#0D111A" />
      <stop offset="75%" stop-color="#121724" />
      <stop offset="100%" stop-color="#090C12" />
    </linearGradient>

    <!-- Deep Ambient Glow Gradients -->
    <radialGradient id="indigo-depth" cx="70%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#2D1F58" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#181333" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0D111A" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyan-glow" cx="25%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#0A3654" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#061B2B" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#07090E" stop-opacity="0" />
    </radialGradient>

    <!-- Glass Wave Ribbon Gradients -->
    <linearGradient id="wave-cyan" x1="10%" y1="20%" x2="90%" y2="80%">
      <stop offset="0%" stop-color="#00D2D3" stop-opacity="0.28" />
      <stop offset="30%" stop-color="#0984E3" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#192A56" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#07090E" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="wave-purple" x1="85%" y1="15%" x2="15%" y2="85%">
      <stop offset="0%" stop-color="#9C88FF" stop-opacity="0.32" />
      <stop offset="35%" stop-color="#5F27CD" stop-opacity="0.20" />
      <stop offset="75%" stop-color="#27134A" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#090B10" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="wave-dark-glass" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#1E273A" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#121824" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0A0E17" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="wave-warm" x1="70%" y1="20%" x2="30%" y2="80%">
      <stop offset="0%" stop-color="#FF9F43" stop-opacity="0.2" />
      <stop offset="40%" stop-color="#EE5253" stop-opacity="0.12" />
      <stop offset="80%" stop-color="#341F97" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#07090E" stop-opacity="0" />
    </linearGradient>

    <!-- Specular Edge Lines -->
    <linearGradient id="edge-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2D3" stop-opacity="0" />
      <stop offset="25%" stop-color="#00D2D3" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#70A1FF" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00D2D3" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="edge-purple" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9C88FF" stop-opacity="0" />
      <stop offset="30%" stop-color="#A29BFE" stop-opacity="0.75" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="85%" stop-color="#6C5CE7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#341F97" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="edge-warm" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FF9F43" stop-opacity="0" />
      <stop offset="45%" stop-color="#FFC048" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#FFA8A8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FF9F43" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- 1. Base Canvas -->
  <rect width="3840" height="2160" fill="url(#canvas-grad)" />

  <!-- 2. Ambient Volumetric Glow Fields -->
  <rect width="3840" height="2160" fill="url(#indigo-depth)" />
  <rect width="3840" height="2160" fill="url(#cyan-glow)" />

  <!-- 3. Flowing Glass Wave Layers -->
  <!-- Layer 1: Background Warm Indigo Swell -->
  <path d="M 0,1650 C 700,1500 1300,1850 2100,1550 C 2900,1250 3300,900 3840,750 L 3840,2160 L 0,2160 Z" 
        fill="url(#wave-warm)" />

  <!-- Layer 2: Deep Dark Glass Structural Wave -->
  <path d="M 0,1350 C 850,1100 1450,1650 2300,1400 C 3150,1150 3450,600 3840,450 L 3840,2160 L 0,2160 Z" 
        fill="url(#wave-dark-glass)" />

  <!-- Layer 3: Cyan Glass Body -->
  <path d="M 0,1050 C 950,850 1600,1450 2450,1200 C 3300,950 3550,450 3840,300 L 3840,2160 L 0,2160 Z" 
        fill="url(#wave-cyan)" />

  <!-- Layer 4: Front Purple / Violet Glass Swell -->
  <path d="M 0,1250 C 650,1400 1450,1100 2200,1350 C 2950,1600 3350,1300 3840,1150 L 3840,2160 L 0,2160 Z" 
        fill="url(#wave-purple)" />

  <!-- 4. Precision Specular Refraction Edges -->
  <!-- Edge A: Razor Cyan Rim (Top Arc) -->
  <path d="M 0,1050 C 950,850 1600,1450 2450,1200 C 3300,950 3550,450 3840,300" 
        fill="none" stroke="url(#edge-cyan)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Edge B: Ultra-fine Highlight Accent -->
  <path d="M 350,970 C 1100,800 1700,1380 2500,1140 C 3200,920 3500,520 3750,380" 
        fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.2" />

  <!-- Edge C: Violet Crest Highlight -->
  <path d="M 0,1250 C 650,1400 1450,1100 2200,1350 C 2950,1600 3350,1300 3840,1150" 
        fill="none" stroke="url(#edge-purple)" stroke-width="2.2" stroke-linecap="round" />

  <!-- Edge D: Subtle Amber Under-Glow Rim -->
  <path d="M 750,1520 C 1350,1820 2050,1540 2800,1280 C 3200,1120 3550,920 3840,820" 
        fill="none" stroke="url(#edge-warm)" stroke-width="1.8" stroke-linecap="round" />

  <!-- Edge E: Lower Dark Ridge Accent -->
  <path d="M 0,1350 C 850,1100 1450,1650 2300,1400 C 3150,1150 3450,600 3840,450" 
        fill="none" stroke="#70A1FF" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- 5. Subtle Grid / Dot Matrix Accent (Developer Aesthetic) -->
  <g opacity="0.04" fill="#FFFFFF">
    <circle cx="1920" cy="540" r="1.5" /><circle cx="1980" cy="540" r="1.5" /><circle cx="2040" cy="540" r="1.5" /><circle cx="2100" cy="540" r="1.5" />
    <circle cx="1920" cy="600" r="1.5" /><circle cx="1980" cy="600" r="1.5" /><circle cx="2040" cy="600" r="1.5" /><circle cx="2100" cy="600" r="1.5" />
    <circle cx="1920" cy="660" r="1.5" /><circle cx="1980" cy="660" r="1.5" /><circle cx="2040" cy="660" r="1.5" /><circle cx="2100" cy="660" r="1.5" />
  </g>
</svg>