DEFAULT sydra
TIMEOUT 50

LABEL sydra
TEXT HELP
Boot the Sydra OS live environment on BIOS.
ENDTEXT
MENU LABEL Sydra OS Live/Install Medium (x86_64, BIOS)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G copytoram=n quiet loglevel=3 udev.log_level=3 systemd.show_status=auto vt.global_cursor_default=0

LABEL sydra_ram
TEXT HELP
Boot the Sydra OS live environment and copy to RAM.
ENDTEXT
MENU LABEL Sydra OS Live/Install Medium (x86_64, BIOS, Copy to RAM)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=y quiet loglevel=3 udev.log_level=3 systemd.show_status=auto vt.global_cursor_default=0

LABEL sydra_nomodeset
TEXT HELP
Boot with safe graphics (nomodeset).
ENDTEXT
MENU LABEL Sydra OS Live/Install Medium (x86_64, BIOS, Safe Graphics)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset quiet loglevel=3 udev.log_level=3 systemd.show_status=auto vt.global_cursor_default=0
